# mapper_params_online_async.yaml
# Place this file at:  ~/mapper_params_online_async.yaml
# Then launch with:
#   ros2 launch slam_toolbox online_async_launch.py \
#       params_file:=$HOME/mapper_params_online_async.yaml

slam_toolbox:
  ros__parameters:

    # ── Plugin / mode ───────────────────────────────────────────
    solver_plugin:              solver_plugins::CeresSolver
    ceres_linear_solver:        SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:       SCHUR_JACOBI
    ceres_trust_strategy:       LEVENBERG_MARQUARDT
    ceres_dogleg_type:          TRADITIONAL_DOGLEG
    ceres_loss_function:        None

    # ── Frames ──────────────────────────────────────────────────
    odom_frame:    odom
    map_frame:     map
    base_frame:    base_link
    scan_topic:    /scan
    use_map_saver: true
    mode:          mapping       # "mapping" or "localization"

    # ── Map update rate (Hz) ────────────────────────────────────
    map_update_interval:     2.0     # seconds between full map updates
    resolution:              0.05    # metres/cell  (5 cm)
    max_laser_range:         8.0     # metres — clip lidar beyond this

    # ── Loop closure ────────────────────────────────────────────
    minimum_travel_distance: 0.3     # metres before adding a new node
    minimum_travel_heading:  0.3     # radians
    scan_buffer_size:        10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine:  0.1
    distance_variance_penalty:         0.5
    angle_variance_penalty:            1.0
    fine_search_angle_offset:          0.00349
    coarse_search_angle_offset:        0.349
    coarse_angle_resolution:           0.0349
    minimum_angle_penalty:             0.9
    minimum_distance_penalty:          0.5
    use_response_expansion:            true

    # ── TF / timing ─────────────────────────────────────────────
    tf_buffer_duration:          30.0
    transform_publish_period:    0.02   # 50 Hz
    transform_timeout:           0.2

    # ── Odometry (wheel encoder or gyro) ────────────────────────
    # If you have no wheel encoders, slam_toolbox can run
    # "scan-matching only" odometry.  Set use_scan_matching to
    # true and odom_frame to "odom".  motor_bridge publishes no
    # /odom, so we rely on the built-in scan-match odometry.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.5
    travel_between_scans: 0.5

    # Debug (set to 0 in production)
    debug_logging:  false
    throttle_scans: 1
